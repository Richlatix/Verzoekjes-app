<!-- Inlogscherm -->
<div id="admin-login-card">
  <h2>Beheer Login</h2>
  <input type="password" id="admin-pin-input" placeholder="Voer PIN of Master Key in">
  <button onclick="verifyAdminPin()">Inloggen</button>
</div>

<!-- Dashboard (verborgen tot inloggen) -->
<div id="admin-dashboard" class="hidden">
  
  <!-- Huisstijl & Kleuren -->
  <section>
    <h3>Kleureninstellingen</h3>
    <label>Achtergrond: <input type="color" id="col-bg"></label>
    <label>Kaarten: <input type="color" id="col-card"></label>
    <label>Accent: <input type="color" id="col-accent"></label>
    <label>Tekst: <input type="color" id="col-text"></label>
    <button onclick="saveColors()">Kleuren Opslaan</button>
  </section>

  <!-- Logo & Branding -->
  <section>
    <h3>Branding & Logo</h3>
    <div id="logo-active-section">
      <img id="current-logo-preview" src="" alt="Logo preview" style="max-width: 150px;">
      <input type="file" id="logo-file-input" accept="image/*">
      <button onclick="uploadLogo()">Upload Nieuw Logo</button>
      <button onclick="removeLogo()">Verwijder Logo</button>
    </div>

    <div id="text-brand-section" class="hidden">
      <input type="text" id="setting-brand-name" placeholder="Merknaam in tekst">
      <button onclick="saveBrandName()">Naam Opslaan</button>
      <button onclick="undoRemoveLogo()">Herstel Logo Standaard</button>
    </div>
  </section>

  <!-- Beveiliging & PIN -->
  <section>
    <h3>DJ PIN Wijzigen</h3>
    <input type="text" id="setting-pincode" maxlength="4" placeholder="4-cijferige PIN">
    <button onclick="savePincode()">PIN Opslaan</button>
  </section>

  <!-- Database & Opschonen -->
  <section>
    <h3>Database Beheer</h3>
    <button onclick="clearXmlDatabase()">⚠️ Alle nummers & verzoekjes wissen</button>
  </section>

  <!-- Supabase Instellingen -->
  <section>
    <h3>Supabase Koppeling</h3>
    <input type="text" id="setting-supabase-url" placeholder="Supabase URL">
    <input type="text" id="setting-supabase-key" placeholder="Supabase Key">
    <input type="password" id="setting-admin-pass" placeholder="Master Wachtwoord">
    <button onclick="saveSupabaseCredentials()">Koppeling Opslaan</button>
  </section>

</div>
