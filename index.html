<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Dashboard</title>
    <!-- FontAwesome voor iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #1db954;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header met Tandwiel */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .header-titles h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }

        .header-titles p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .gear-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gear-btn:hover {
            transform: rotate(90deg);
            color: var(--accent-color);
        }

        /* Visitekaartje Sectie */
        .business-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .business-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a2a2a;
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.2s;
            border: 1px solid var(--border-color);
        }

        .social-btn:hover {
            background: var(--accent-color);
            color: #000;
            transform: translateY(-2px);
        }

        /* Modal / Instellingen Menu */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
        }

        .platform-setting {
            background: #171717;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .platform-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .platform-row span {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .save-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 1rem;
        }

        .save-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <header>
            <div class="header-titles">
                <h1 id="display-title">DJ Dashboard</h1>
                <p id="display-subtitle">Welkom terug, beheer hier jouw gegevens</p>
            </div>
            <button class="gear-btn" id="openSettings" title="Instellingen"><i class="fa-solid fa-gear"></i></button>
        </header>

        <!-- Visitekaartje -->
        <div class="business-card">
            <h2>Visitekaartje & Socials</h2>
            <div class="social-links" id="socialLinksContainer">
                <!-- Wordt dynamisch ingeladen via JS -->
            </div>
        </div>
    </div>

    <!-- Instellingen Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Dashboard Instellingen</h3>
                <button class="close-btn" id="closeSettings"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="settingsForm">
                <div class="form-group">
                    <label for="inputTitle">Dashboard Titel</label>
                    <input type="text" id="inputTitle" value="DJ Dashboard">
                </div>
                <div class="form-group">
                    <label for="inputSubtitle">Dashboard Subtitel</label>
                    <input type="text" id="inputSubtitle" value="Welkom terug, beheer hier jouw gegevens">
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

                <h4 style="margin-bottom: 15px;">Visitekaartje Platformen</h4>
                
                <!-- Platform instellingen container -->
                <div id="platformsConfigContainer"></div>

                <button type="submit" class="save-btn">Opslaan</button>
            </form>
        </div>
    </div>

    <script>
        // Standaard configuratie
        const defaultConfig = {
            title: "DJ Dashboard",
            subtitle: "Welkom terug, beheer hier jouw gegevens",
            platforms: {
                mail: { name: "Mail", icon: "fa-solid fa-envelope", active: true, value: "mailto:jouw@email.com" },
                whatsapp: { name: "WhatsApp", icon: "fa-brands fa-whatsapp", active: true, value: "https://wa.me/31612345678" },
                instagram: { name: "Instagram", icon: "fa-brands fa-instagram", active: true, value: "https://instagram.com/jouwaccount" },
                tiktok: { name: "TikTok", icon: "fa-brands fa-tiktok", active: true, value: "https://tiktok.com/@jouwaccount" },
                facebook: { name: "Facebook", icon: "fa-brands fa-facebook", active: true, value: "https://facebook.com/jouwaccount" }
            }
        };

        // Laad configuratie uit localStorage of gebruik de standaardwaarden
        let config = JSON.parse(localStorage.getItem('djDashboardConfig')) || defaultConfig;

        // Elementen selecteren
        const modal = document.getElementById('settingsModal');
        const openBtn = document.getElementById('openSettings');
        const closeBtn = document.getElementById('closeSettings');
        const settingsForm = document.getElementById('settingsForm');
        
        const displayTitle = document.getElementById('display-title');
        const displaySubtitle = document.getElementById('display-subtitle');
        const socialLinksContainer = document.getElementById('socialLinksContainer');
        const platformsConfigContainer = document.getElementById('platformsConfigContainer');

        const inputTitle = document.getElementById('inputTitle');
        const inputSubtitle = document.getElementById('inputSubtitle');

        // Functie om het dashboard te renderen
        function renderDashboard() {
            displayTitle.textContent = config.title;
            displaySubtitle.textContent = config.subtitle;
            
            socialLinksContainer.innerHTML = '';

            for (let key in config.platforms) {
                let p = config.platforms[key];
                if (p.active && p.value.trim() !== '') {
                    let a = document.createElement('a');
                    a.href = p.value;
                    a.className = 'social-btn';
                    a.target = '_blank';
                    a.innerHTML = `<i class="${p.icon}"></i> ${p.name}`;
                    socialLinksContainer.appendChild(a);
                }
            }
        }

        // Functie om de instellingen modal te vullen
        function renderSettingsModal() {
            inputTitle.value = config.title;
            inputSubtitle.value = config.subtitle;
            
            platformsConfigContainer.innerHTML = '';

            for (let key in config.platforms) {
                let p = config.platforms[key];
                
                let div = document.createElement('div');
                div.className = 'platform-setting';
                div.innerHTML = `
                    <div class="platform-row">
                        <span><i class="${p.icon}"></i> ${p.name}</span>
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;">
                            Tonen <input type="checkbox" name="${key}-active" ${p.active ? 'checked' : ''}>
                        </label>
                    </div>
                    <input type="text" name="${key}-value" value="${p.value}" placeholder="Link / URL / Contactinfo">
                `;
                platformsConfigContainer.appendChild(div);
            }
        }

        // Open en sluit modal logica
        openBtn.addEventListener('click', () => {
            renderSettingsModal();
            modal.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        // Opslaan formulier
        settingsForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            config.title = inputTitle.value;
            config.subtitle = inputSubtitle.value;

            for (let key in config.platforms) {
                let activeCheckbox = settingsForm.querySelector(`[name="${key}-active"]`);
                let valueInput = settingsForm.querySelector(`[name="${key}-value"]`);

                config.platforms[key].active = activeCheckbox.checked;
                config.platforms[key].value = valueInput.value;
            }

            // Opslaan in localStorage
            localStorage.setItem('djDashboardConfig', JSON.stringify(config));

            renderDashboard();
            modal.classList.remove('active');
        });

        // Initiële laadbeurt bij opstarten
        renderDashboard();
    </script>
</body>
</html>
