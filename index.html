<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive-in Verzoekjes</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 20px; max-width: 600px; margin: auto; }
    h1, h2 { color: #00ff88; text-align: center; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; }
    input { background: #222; color: white; border: 1px solid #444; }
    button { background: #00ff88; color: black; font-weight: bold; cursor: pointer; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .vote-btn { width: auto; padding: 5px 15px; margin: 0 2px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>🎵 Drive-in Verzoekjes</h1>

  <!-- INSTELLINGEN (Alleen eerste keer invullen) -->
  <div id="setup-section">
    <h2>1. Vul je Supabase Gegevens in</h2>
    <input type="text" id="supa-url" placeholder="Supabase Project URL (https://...)">
    <input type="text" id="supa-key" placeholder="Supabase Anon Key">
    <button onclick="saveSetup()">Opslaan & Starten</button>
  </div>

  <!-- HOOFDMENU -->
  <div id="app-section" class="hidden">
    <div style="display:flex; gap:10px;">
      <button onclick="showView('guest')">📱 Gastenscherm</button>
      <button onclick="showView('dj')">🎧 DJ Dashboard</button>
    </div>

    <!-- GASTENSCHERM -->
    <div id="guest-view" class="hidden">
      <h2>Vraag een nummer aan</h2>
      <input type="text" id="search-input" placeholder="Zoek op titel of artiest..." onkeyup="filterSongs()">
      <div id="song-list"></div>
    </div>

    <!-- DJ DASHBOARD & XML UPLOAD -->
    <div id="dj-view" class="hidden">
      <h2>🎧 DJ Live Dashboard</h2>
      <h3>Upload Rekordbox XML</h3>
      <input type="file" id="xml-file" accept=".xml">
      <button onclick="uploadXML()">Importeer Rekordbox Lijst</button>

      <h3>Aangevraagde Nummers (Meeste stemmen)</h3>
      <div id="request-list"></div>
    </div>
  </div>

  <script>
    let supabase = null;
    let allSongs = [];

    function saveSetup() {
      const url = document.getElementById('supa-url').value;
      const key = document.getElementById('supa-key').value;
      if (!url || !key) return alert('Vul beide velden in!');
      localStorage.setItem('supa_url', url);
      localStorage.setItem('supa_key', key);
      initSupabase();
    }

    function initSupabase() {
      const url = localStorage.getItem('supa_url');
      const key = localStorage.getItem('supa_key');
      if (url && key) {
        supabase = window.supabase.createClient(url, key);
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        showView('guest');
        loadRequests();
        listenToRealtime();
      }
    }

    function showView(view) {
      document.getElementById('guest-view').classList.add('hidden');
      document.getElementById('dj-view').classList.add('hidden');
      document.getElementById(view + '-view').classList.remove('hidden');
    }

    // --- REKORDBOX XML UPLOAD ---
    async function uploadXML() {
      const fileInput = document.getElementById('xml-file');
      if (!fileInput.files[0]) return alert('Kies eerst een .xml bestand!');
      
      const reader = new FileReader();
      reader.onload = async function(e) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(e.target.result, "text/xml");
        const tracks = xmlDoc.getElementsByTagName("TRACK");
        
        let imported = [];
        for (let i = 0; i < tracks.length; i++) {
          imported.push({
            title: tracks[i].getAttribute("Name"),
            artist: tracks[i].getAttribute("Artist"),
            votes: 0,
            status: 'available'
          });
        }

        const { error } = await supabase.from('requests').insert(imported);
        if (error) alert('Fout bij uploaden: ' + error.message);
        else alert(imported.length + ' nummers succesvol geïmporteerd uit Rekordbox!');
      };
      reader.readAsText(fileInput.files[0]);
    }

    // --- STEMMEN & VERZOEKJES ---
    async function loadRequests() {
      const { data } = await supabase.from('requests').select('*').order('votes', { ascending: false });
      if (data) {
        allSongs = data;
        renderRequests();
      }
    }

    function renderRequests() {
      const djList = document.getElementById('request-list');
      djList.innerHTML = '';
      
      allSongs.filter(s => s.status === 'requested').forEach(song => {
        djList.innerHTML += `
          <div class="card">
            <div><strong>${song.title}</strong><br><small>${song.artist}</small></div>
            <div>
              <span>👍 ${song.votes}</span>
              <button class="vote-btn" onclick="markDone(${song.id})">✅ Gedraaid</button>
            </div>
          </div>`;
      });
    }

    function filterSongs() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const songList = document.getElementById('song-list');
      songList.innerHTML = '';

      if (query.length < 2) return;

      allSongs.filter(s => (s.title + ' ' + s.artist).toLowerCase().includes(query)).slice(0, 10).forEach(song => {
        songList.innerHTML += `
          <div class="card">
            <div><strong>${song.title}</strong><br><small>${song.artist}</small></div>
            <div>
              <button class="vote-btn" onclick="vote(${song.id}, 1)">👍</button>
              <button class="vote-btn" onclick="vote(${song.id}, -1)">👎</button>
            </div>
          </div>`;
      });
    }

    async function vote(id, change) {
      const song = allSongs.find(s => s.id === id);
      if (!song) return;
      
      const newVotes = (song.votes || 0) + change;
      await supabase.from('requests').update({ votes: newVotes, status: 'requested' }).eq('id', id);
    }

    async function markDone(id) {
      await supabase.from('requests').update({ status: 'done' }).eq('id', id);
    }

    function listenToRealtime() {
      supabase.channel('requests-change')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, () => loadRequests())
        .subscribe();
    }

    window.onload = initSupabase;
  </script>
</body>
</html>
