<script>
    const SUPABASE_URL = "https://vwbhqtmrenfaqcbwmmqx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_BZTtNRR2HHFUGZm_R3LahA_XcfQwqHX";

    let dbClient = null;
    let allSongs = [];
    let isDjLoggedIn = false;
    // Sla op welke sessie de telefoon DINKT dat actief is
    let localSessionId = localStorage.getItem('active_session_id') || null;
    const DJ_PIN = "3977";

    /* CUSTOM POPUP / TOAST NOTIFICATIE */
    function toonPopup(bericht) {
      const oudePopup = document.getElementById('custom-toast');
      if (oudePopup) oudePopup.remove();

      const popup = document.createElement('div');
      popup.id = 'custom-toast';
      popup.className = 'toast-popup';
      popup.innerText = bericht;

      document.body.appendChild(popup);

      setTimeout(() => {
        if (popup) popup.remove();
      }, 3000);
    }

    function getVotedSongIds() {
      try {
        return JSON.parse(localStorage.getItem('voted_song_ids')) || [];
      } catch (e) {
        return [];
      }
    }

    function recordVote(id) {
      const voted = getVotedSongIds();
      if (!voted.includes(id)) {
        voted.push(id);
        localStorage.setItem('voted_song_ids', JSON.stringify(voted));
      }
    }

    async function initSupabase() {
      try {
        dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        showView('guest');
        await checkActiveSession();
        loadRequests();
        loadWelcomeText();
        listenToRealtime();
        
        setInterval(() => {
          checkActiveSession();
          loadRequests();
          loadWelcomeText();
        }, 3000);
      } catch (err) {
        toonPopup('Fout bij verbinden met Supabase!');
      }
    }

    /* GECORRIGEERDE SESSIE BEHEER LOGICA */
    async function checkActiveSession() {
      if (!dbClient || isDjLoggedIn) return;

      const { data } = await dbClient
        .from('settings')
        .select('value')
        .eq('key', 'session_id')
        .maybeSingle();

      if (data && data.value) {
        const activeServerSession = data.value;

        // Eerste keer dat de telefoon de pagina laadt: koppel aan de huidige sessie
        if (!localSessionId) {
          localSessionId = activeServerSession;
          localStorage.setItem('active_session_id', activeServerSession);
          return;
        }

        // Als de sessie op de server verandert t.o.v. de telefoon: BLOKKEER TELEFOON!
        if (localSessionId !== activeServerSession) {
          document.getElementById('guest-view').classList.add('hidden');
          document.getElementById('event-ended-view').classList.remove('hidden');
        }
      }
    }

    async function startNewSession() {
      const confirmStart = confirm("Weet je zeker dat je een nieuw feest wilt starten? Geopende telefoons van het vorige feest worden direct geblokkeerd.");
      if (!confirmStart) return;

      const newSessionId = "feest_" + Date.now();

      // 1. Wis de los ingestuurde verzoekjes
      await dbClient.from('requests').delete().eq('status', 'requested');
      await dbClient.from('requests').delete().eq('status', 'done');

      // 2. Reset XML nummers
      await dbClient.from('requests').update({ votes: 0, status: 'available' }).eq('status', 'available');

      // 3. Update het sessie-ID in Supabase (dit triggert de telefoons!)
      await dbClient
        .from('settings')
        .upsert({ key: 'session_id', value: newSessionId }, { onConflict: 'key' });

      // 4. Update lokale status op de laptop zelf
      localSessionId = newSessionId;
      localStorage.setItem('active_session_id', newSessionId);
      localStorage.removeItem('voted_song_ids');

      toonPopup("Nieuw feest gestart! Oude telefoons zijn geblokkeerd.");
      loadRequests();
    }

    /* TOGGLE TANDWIEL MENU */
    function toggleSettingsMenu() {
      const panel = document.getElementById('settings-panel');
      const btn = document.getElementById('settings-toggle-btn');
      if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        btn.style.borderColor = 'var(--accent-color)';
        btn.style.color = 'var(--accent-color)';
      } else {
        panel.classList.add('hidden');
        btn.style.borderColor = 'var(--border-color)';
        btn.style.color = '#ffffff';
      }
    }

    /* WELKOMSTTEKST BEHEER */
    async function loadWelcomeText() {
      if (!dbClient) return;
      const { data } = await dbClient
        .from('settings')
        .select('value')
        .eq('key', 'welcome_text')
        .maybeSingle();

      let text = "";
      if (data && data.value) {
        text = data.value;
      } else {
        text = localStorage.getItem('welcome_text') || "";
      }

      const banner = document.getElementById('welcome-banner');
      const input = document.getElementById('welcome-text-input');

      if (text.trim() !== "") {
        banner.innerText = text;
        banner.classList.remove('hidden');
        if (input && document.activeElement !== input) input.value = text;
      } else {
        banner.innerText = "";
        banner.classList.add('hidden');
        if (input && document.activeElement !== input) input.value = "";
      }
    }

    async function saveWelcomeText() {
      const text = document.getElementById('welcome-text-input').value.trim();
      localStorage.setItem('welcome_text', text);

      if (dbClient) {
        await dbClient
          .from('settings')
          .upsert({ key: 'welcome_text', value: text }, { onConflict: 'key' });
      }

      loadWelcomeText();
      toonPopup('Welkomsttekst bijgewerkt!');
    }

    async function clearWelcomeText() {
      document.getElementById('welcome-text-input').value = "";
      saveWelcomeText();
    }

    function toggleCustomForm() {
      const form = document.getElementById('custom-form-container');
      const btn = document.getElementById('toggle-custom-btn');
      
      if (form.classList.contains('hidden')) {
        form.classList.remove('hidden');
        btn.innerText = '➖ Sluit handmatig invoeren';
      } else {
        form.classList.add('hidden');
        btn.innerText = '➕ Staat je nummer er niet tussen? Klik hier';
      }
    }

    function showView(view) {
      document.getElementById('guest-view').classList.add('hidden');
      document.getElementById('pin-view').classList.add('hidden');
      document.getElementById('dj-view').classList.add('hidden');
      
      const loginBtn = document.getElementById('dj-login-btn');
      const backBtn = document.getElementById('back-to-guest-btn');

      if (view === 'guest') {
        loginBtn.classList.remove('hidden');
        backBtn.classList.add('hidden');
      } else if (view === 'dj') {
        loginBtn.classList.add('hidden');
        backBtn.classList.remove('hidden');
      } else {
        loginBtn.classList.add('hidden');
        backBtn.classList.add('hidden');
      }

      document.getElementById(view + '-view').classList.remove('hidden');
    }

    function checkDJPass() {
      if (isDjLoggedIn) showView('dj');
      else showView('pin');
    }

    function verifyPin() {
      const enteredPin = document.getElementById('dj-pin-input').value;
      if (enteredPin === DJ_PIN) {
        isDjLoggedIn = true;
        document.getElementById('dj-pin-input').value = '';
        showView('dj');
        toonPopup('Succesvol ingelogd als DJ!');
      } else {
        toonPopup('Onjuiste pincode!');
        document.getElementById('dj-pin-input').value = '';
      }
    }

    async function vote(id) {
      const votedIds = getVotedSongIds();
      if (votedIds.includes(id)) {
        toonPopup('Je hebt al op dit nummer gestemd!');
        return;
      }

      const song = allSongs.find(s => s.id === id);
      if (!song) return;
      
      const currentVotes = Number(song.votes) || 0;
      const newVotes = currentVotes + 1;

      const { error } = await dbClient
        .from('requests')
        .update({ votes: newVotes, status: 'requested' })
        .eq('id', id);

      if (error) {
        toonPopup('Fout bij stemmen!');
      } else {
        recordVote(id);
        toonPopup(`Stem op "${song.title}" verwerkt!`);
        loadRequests();
      }
    }

    async function loadRequests() {
      if (!dbClient) return;
      const { data, error } = await dbClient
        .from('requests')
        .select('*')
        .order('votes', { ascending: false });

      if (data && !error) {
        allSongs = data;
        renderAllViews();
      }
    }

    function renderAllViews() {
      renderGuestRequests();
      renderDjRequests();
      renderUploadedXmlFiles();
      filterSongs();
    }

    function renderGuestRequests() {
      const guestList = document.getElementById('guest-requested-list');
      const guestDoneList = document.getElementById('guest-done-list');
      guestList.innerHTML = '';
      guestDoneList.innerHTML = '';

      const requested = allSongs.filter(s => s.status === 'requested');
      const done = allSongs.filter(s => s.status === 'done');
      const votedIds = getVotedSongIds();

      if (requested.length === 0) {
        guestList.innerHTML = '<p style="text-align:center; color:var(--subtext-color);">Er zijn nog geen actieve verzoekjes. Wees de eerste!</p>';
      } else {
        requested.forEach(song => {
          const noteText = song.note ? `<br><small style="color:var(--accent-color);">💬 "${song.note}"</small>` : '';
          const hasVoted = votedIds.includes(song.id);
          const btnText = hasVoted ? 'Gestemd ✅' : '+1 Stem';
          const disabledAttr = hasVoted ? 'disabled' : '';

          guestList.innerHTML += `
            <div class="card">
              <div>
                <strong>${song.title}</strong><br>
                <small style="color:var(--subtext-color);">${song.artist}</small>
                ${noteText}
              </div>
              <div>
                <span class="badge">👍 ${song.votes || 0}</span>
                <button class="vote-btn" onclick="vote(${song.id})" ${disabledAttr}>${btnText}</button>
              </div>
            </div>`;
        });
      }

      if (done.length === 0) {
        guestDoneList.innerHTML = '<p style="text-align:center; color:var(--subtext-color);">Nog geen nummers afgevinkt.</p>';
      } else {
        done.forEach(song => {
          const noteText = song.note ? `<br><small>💬 "${song.note}"</small>` : '';
          guestDoneList.innerHTML += `
            <div class="card done">
              <div>
                <strong>${song.title}</strong><br>
                <small style="color:var(--subtext-color);">${song.artist}</small>
                ${noteText}
              </div>
              <div><span class="badge">✅ Gedraaid</span></div>
            </div>`;
        });
      }
    }

    function renderDjRequests() {
      const djList = document.getElementById('request-list');
      const djDoneList = document.getElementById('dj-done-list');
      djList.innerHTML = '';
      djDoneList.innerHTML = '';
      
      const requested = allSongs.filter(s => s.status === 'requested');
      const done = allSongs.filter(s => s.status === 'done');

      if (requested.length === 0) {
        djList.innerHTML = '<p style="text-align:center; color:var(--subtext-color);">Nog geen actieve verzoekjes ontvangen.</p>';
      } else {
        requested.forEach(song => {
          const noteText = song.note ? `<br><small style="color:var(--accent-color);">💬 "${song.note}"</small>` : '';
          djList.innerHTML += `
            <div class="card">
              <div>
                <strong>${song.title}</strong><br>
                <small style="color:var(--subtext-color);">${song.artist}</small>
                ${noteText}
              </div>
              <div>
                <span style="margin-right:10px;">👍 ${song.votes || 0}</span>
                <button class="vote-btn" onclick="markDone(${song.id})">✅ Gedraaid</button>
              </div>
            </div>`;
        });
      }

      if (done.length === 0) {
        djDoneList.innerHTML = '<p style="text-align:center; color:var(--subtext-color);">Nog geen nummers afgevinkt.</p>';
      } else {
        done.forEach(song => {
          const noteText = song.note ? `<br><small>💬 "${song.note}"</small>` : '';
          djDoneList.innerHTML += `
            <div class="card done">
              <div>
                <strong>${song.title}</strong><br>
                <small style="color:var(--subtext-color);">${song.artist}</small>
                ${noteText}
              </div>
              <div>
                <button class="vote-btn secondary-btn" onclick="unmarkDone(${song.id})">↩️ Terugzetten</button>
              </div>
            </div>`;
        });
      }
    }

    function renderUploadedXmlFiles() {
      const xmlListContainer = document.getElementById('uploaded-xml-list');
      xmlListContainer.innerHTML = '';

      const xmlSongs = allSongs.filter(s => s.source_file);

      if (xmlSongs.length === 0) {
        xmlListContainer.innerHTML = '<p style="color:var(--subtext-color); font-size:0.85em; text-align:center;">Geen bestanden geüpload.</p>';
        return;
      }

      const filesMap = {};
      xmlSongs.forEach(song => {
        const fileName = song.source_file || 'Onbekend XML Bestand';
        if (!filesMap[fileName]) {
          filesMap[fileName] = {
            name: fileName,
            count: 0,
            date: song.created_at ? new Date(song.created_at).toLocaleString('nl-NL', { dateStyle: 'short', timeStyle: 'short' }) : 'Onbekend'
          };
        }
        filesMap[fileName].count++;
      });

      Object.values(filesMap).forEach(file => {
        xmlListContainer.innerHTML += `
          <div class="xml-file-item">
            <span>📄 <strong>${file.name}</strong> (${file.count} nummers)</span>
            <span style="color:var(--subtext-color);">${file.date}</span>
          </div>`;
      });
    }

    function filterSongs() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const resultsSection = document.getElementById('search-results-section');
      const songList = document.getElementById('song-list');
      songList.innerHTML = '';

      if (query.length < 2) {
        resultsSection.classList.add('hidden');
        return;
      }

      resultsSection.classList.remove('hidden');
      const matches = allSongs.filter(s => s.status === 'available' && (s.title + ' ' + s.artist).toLowerCase().includes(query)).slice(0, 10);
      const votedIds = getVotedSongIds();

      if (matches.length === 0) {
        songList.innerHTML = '<p style="color:var(--subtext-color); font-size:0.9em;">Geen nummers gevonden in de bibliotheek. Gebruik de knop hieronder om handmatig in te vullen!</p>';
        return;
      }

      matches.forEach(song => {
        const hasVoted = votedIds.includes(song.id);
        const btnText = hasVoted ? 'Gestemd ✅' : 'Aanvragen';
        const disabledAttr = hasVoted ? 'disabled' : '';

        songList.innerHTML += `
          <div class="card">
            <div><strong>${song.title}</strong><br><small style="color:var(--subtext-color);">${song.artist}</small></div>
            <div>
              <button class="vote-btn" onclick="vote(${song.id})" ${disabledAttr}>${btnText}</button>
            </div>
          </div>`;
      });
    }

    async function submitCustomRequest() {
      const titleInput = document.getElementById('custom-title');
      const artistInput = document.getElementById('custom-artist');
      const noteInput = document.getElementById('custom-note');

      const title = titleInput.value.trim();
      const artist = artistInput.value.trim() || 'Spotify Verzoek';
      const note = noteInput.value.trim();

      if (!title) return toonPopup('Vul alstublieft een titel in!');

      const { data, error } = await dbClient.from('requests').insert([{
        title: title,
        artist: artist,
        note: note,
        votes: 1,
        status: 'requested'
      }]).select();

      if (error) {
        toonPopup('Er ging iets mis bij het verzenden!');
      } else {
        toonPopup(`Verzoekje "${title}" is verstuurd!`);
        if (data && data[0]) {
          recordVote(data[0].id);
        }
        titleInput.value = '';
        artistInput.value = '';
        noteInput.value = '';
        toggleCustomForm();
        loadRequests();
      }
    }

    async function markDone(id) {
      const { error } = await dbClient.from('requests').update({ status: 'done' }).eq('id', id);
      if (error) toonPopup('Fout bij afvinken!');
      else {
        toonPopup('Nummer gemarkeerd als gedraaid!');
        loadRequests();
      }
    }

    async function unmarkDone(id) {
      const { error } = await dbClient.from('requests').update({ status: 'requested' }).eq('id', id);
      if (error) toonPopup('Fout bij terugzetten!');
      else {
        toonPopup('Nummer teruggezet naar actieve lijst!');
        loadRequests();
      }
    }

    async function wipeRequests() {
      const confirmWipe = confirm("Weet je ZEKER dat je alle actieve verzoekjes wilt wissen?");
      if (!confirmWipe) return;

      const { error } = await dbClient.from('requests').delete().eq('status', 'requested');
      await dbClient.from('requests').delete().eq('status', 'done');

      if (error) toonPopup('Fout bij het wissen!');
      else {
        toonPopup('Actieve verzoekjes zijn gewist!');
        localStorage.removeItem('voted_song_ids');
        loadRequests();
      }
    }

    function downloadCSV() {
      const requested = allSongs.filter(s => s.status === 'requested' || s.status === 'done');
      if (requested.length === 0) return toonPopup('Geen verzoekjes om te exporteren!');

      let csvContent = "data:text/csv;charset=utf-8,Titel;Artiest;Stemmen;Opmerking;Status\n";
      requested.forEach(s => {
        const note = (s.note || "").replace(/;/g, ",");
        csvContent += `"${s.title}";"${s.artist}";"${s.votes}";"${note}";"${s.status}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `verzoekjes_export_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      toonPopup('Lijst gedownload!');
    }

    async function uploadXML() {
      const fileInput = document.getElementById('xml-file');
      const file = fileInput.files[0];
      if (!file) return toonPopup('Kies eerst een .xml bestand!');
      
      const fileName = file.name;
      const reader = new FileReader();
      
      reader.onload = async function(e) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(e.target.result, "text/xml");
        const tracks = xmlDoc.getElementsByTagName("TRACK");
        
        let imported = [];
        for (let i = 0; i < tracks.length; i++) {
          const title = tracks[i].getAttribute("Name");
          const artist = tracks[i].getAttribute("Artist");
          if (title) {
            imported.push({ 
              title: title, 
              artist: artist || "Onbekend", 
              votes: 0, 
              status: 'available',
              source_file: fileName 
            });
          }
        }

        const { error } = await dbClient.from('requests').insert(imported);
        if (error) toonPopup('Fout bij uploaden van XML!');
        else {
          toonPopup(`${imported.length} nummers geïmporteerd uit XML!`);
          fileInput.value = '';
          loadRequests();
        }
      };
      reader.readAsText(file);
    }

    function listenToRealtime() {
      if (!dbClient) return;
      dbClient.channel('requests-change')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, () => {
          checkActiveSession();
          loadRequests();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, () => {
          checkActiveSession();
          loadWelcomeText();
        })
        .subscribe();
    }

    window.onload = initSupabase;
  </script>
