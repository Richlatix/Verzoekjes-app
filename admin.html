<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatRequest - Admin & Huisstijl Beheer</title>
  
  <script src="stijl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0b0c16;
      --card-bg: #151728;
      --text-color: #f3f4f6;
      --accent-color: #7c3aed;
      --border-color: #242842;
      --subtext-color: #9ca3af;
      --danger-color: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      padding: 24px 20px;
      max-width: 600px;
      margin: auto;
    }
    h1, h2, h3 { color: #fff; text-align: center; margin-bottom: 12px; }
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    input, button, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: #0d0f1d;
      color: var(--text-color);
      font-family: inherit;
    }
    button {
      background: var(--accent-color);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .secondary-btn { background: #1f233d; color: #fff; }
    .danger-btn { background: var(--danger-color); color: #fff; }
    .hidden { display: none !important; }
    .color-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .color-row label { font-size: 0.9em; color: var(--subtext-color); }
    .color-row input[type="color"] { width: 50px; height: 38px; padding: 0; border: none; cursor: pointer; background: transparent; }
    .toast-popup {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #151728;
      color: #ffffff;
      border: 1px solid var(--accent-color);
      padding: 12px 24px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 9999;
      font-weight: 700;
    }
    .preview-logo { max-height: 80px; display: block; margin: 12px auto; object-fit: contain; }
  </style>
</head>
<body>

  <!-- INLOGSCHERM ADMIN -->
  <div id="admin-login-card" class="card" style="max-width: 400px; margin: 50px auto; text-align: center;">
    <h2>🔐 Admin Inloggen</h2>
    <p style="color:var(--subtext-color); font-size:0.85em; margin-bottom:12px;">Voer de DJ-pincode of masterkey in:</p>
    <input type="password" id="admin-pin-input" placeholder="Pincode" maxlength="15" style="text-align:center; font-size:1.5rem; letter-spacing:6px;">
    <button onclick="verifyAdminPin()">Inloggen</button>
    <button onclick="window.location.href='index.html'" class="secondary-btn" style="margin-top:8px;">← Terug naar App</button>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="admin-dashboard" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
      <h2 style="margin:0;">⚙️ Admin Dashboard</h2>
      <button onclick="window.location.href='index.html'" class="secondary-btn" style="width:auto; padding:8px 16px;">Naar App →</button>
    </div>

    <!-- 1. HUISSTIJL & KLEUREN -->
    <div class="card">
      <h3>🎨 Huisstijl & Kleuren</h3>
      <div class="color-row">
        <label>Achtergrondkleur (Body)</label>
        <input type="color" id="col-bg" value="#0b0c16">
      </div>
      <div class="color-row">
        <label>Kaart Achtergrond</label>
        <input type="color" id="col-card" value="#151728">
      </div>
      <div class="color-row">
        <label>Accentkleur (Knoppen/Highlights)</label>
        <input type="color" id="col-accent" value="#7c3aed">
      </div>
      <div class="color-row">
        <label>Tekstkleur</label>
        <input type="color" id="col-text" value="#f3f4f6">
      </div>
      <button onclick="saveColors()">Kleuren Opslaan</button>
    </div>

    <!-- 2. LOGO OF TEKST BEHEREN -->
    <div class="card">
      <h3>🖼️ Logo of Tekst Header</h3>
      <div id="logo-active-section">
        <img id="current-logo-preview" class="preview-logo" src="Logo.png" alt="Huidig Logo">
        <input type="file" id="logo-file-input" accept="image/png, image/jpeg, image/webp">
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button onclick="uploadLogo()">Logo Uploaden</button>
          <button onclick="removeLogo()" class="danger-btn">Verwijderen</button>
        </div>
      </div>
      <div id="text-brand-section" class="hidden" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
        <label style="font-size:0.85em; color:var(--accent-color); font-weight:bold;">✍️ Tekstnaam als Header:</label>
        <input type="text" id="setting-brand-name" placeholder="Bijv. BeatRequest">
        <button onclick="saveBrandName()">Tekstnaam Opslaan</button>
        <button onclick="undoRemoveLogo()" class="secondary-btn" style="margin-top: 6px;">↩️ Gebruik weer een Afbeelding Logo</button>
      </div>
    </div>

    <!-- 3. DATABASE BEHEER -->
    <div class="card">
      <h3>🗄️ Muziekdatabase Beheer</h3>
      <button onclick="clearXmlDatabase()" class="danger-btn">🗑️ Geïmporteerde Muziek/XML Wissschonen</button>
    </div>

    <!-- 4. PINCODE -->
    <div class="card">
      <h3>🔑 DJ Pincode</h3>
      <input type="text" id="setting-pincode" maxlength="4" placeholder="3977">
      <button onclick="savePincode()">Pincode Opslaan</button>
    </div>

    <!-- 5. SUPABASE CONFIGURATIE -->
    <div class="card">
      <details>
        <summary style="cursor: pointer; font-weight: bold; color: var(--subtext-color);">⚙️ Geavanceerd: Supabase Koppeling</summary>
        <div style="margin-top: 15px;">
          <label style="font-size:0.8em; color:var(--subtext-color);">Supabase URL:</label>
          <input type="text" id="setting-supabase-url">
          <label style="font-size:0.8em; color:var(--subtext-color);">Supabase Key:</label>
          <input type="password" id="setting-supabase-key">
          <label style="font-size:0.8em; color:var(--subtext-color);">Admin Wachtwoord:</label>
          <input type="password" id="setting-admin-pass">
          <button onclick="saveSupabaseCredentials()" class="danger-btn" style="margin-top: 10px;">Opslaan & Herladen</button>
        </div>
      </details>
    </div>
  </div>

  <script>
    const SUPABASE_URL = localStorage.getItem('custom_supabase_url') || "https://vwbhqtmrenfaqcbwmmqx.supabase.co";
    const SUPABASE_KEY = localStorage.getItem('custom_supabase_key') || "sb_publishable_BZTtNRR2HHFUGZm_R3LahA_XcfQwqHX";
    let dbClient = null;
    let activeDjPin = (typeof HUISSTIJL !== 'undefined' && HUISSTIJL.pincode) ? HUISSTIJL.pincode : "3977";
    const MASTER_KEY = "Admin3977";

    document.addEventListener("DOMContentLoaded", () => {
      dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      loadAdminSettings();
    });

    function toonPopup(bericht) {
      const oude = document.getElementById('custom-toast');
      if (oude) oude.remove();
      const p = document.createElement('div');
      p.id = 'custom-toast';
      p.className = 'toast-popup';
      p.innerText = bericht;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3000);
    }

    function verifyAdminPin() {
      const val = document.getElementById('admin-pin-input').value.trim();
      if (val === activeDjPin || val === MASTER_KEY) {
        document.getElementById('admin-login-card').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        toonPopup('Welkom in het Beheer!');
      } else {
        toonPopup('Onjuiste pincode!');
        document.getElementById('admin-pin-input').value = '';
      }
    }

    async function loadAdminSettings() {
      if (!dbClient) return;
      document.getElementById('setting-supabase-url').value = SUPABASE_URL;
      document.getElementById('setting-supabase-key').value = SUPABASE_KEY;

      const { data } = await dbClient.from('settings').select('*').in('key', ['app_colors', 'app_pincode', 'logo_url', 'app_brand_name']);
      if (data) {
        data.forEach(item => {
          if (item.key === 'app_colors') {
            try {
              const c = JSON.parse(item.value);
              if(c.bg) document.getElementById('col-bg').value = c.bg;
              if(c.card) document.getElementById('col-card').value = c.card;
              if(c.accent) document.getElementById('col-accent').value = c.accent;
              if(c.text) document.getElementById('col-text').value = c.text;
            } catch(e) {}
          }
          if (item.key === 'app_pincode' && item.value) {
            document.getElementById('setting-pincode').value = item.value;
            activeDjPin = item.value;
          }
          if (item.key === 'logo_url') {
            if (item.value === 'REMOVED' || !item.value) toggleTextBrandMode(true);
            else {
              toggleTextBrandMode(false);
              document.getElementById('current-logo-preview').src = item.value;
            }
          }
          if (item.key === 'app_brand_name') document.getElementById('setting-brand-name').value = item.value || '';
        });
      }
      if (!document.getElementById('setting-pincode').value) document.getElementById('setting-pincode').value = activeDjPin;
    }

    function toggleTextBrandMode(isTextMode) {
      if (isTextMode) {
        document.getElementById('logo-active-section').classList.add('hidden');
        document.getElementById('text-brand-section').classList.remove('hidden');
      } else {
        document.getElementById('logo-active-section').classList.remove('hidden');
        document.getElementById('text-brand-section').classList.add('hidden');
      }
    }

    async function removeLogo() {
      if (!confirm("Logo verwijderen en overschakelen naar tekst?")) return;
      await dbClient.from('settings').upsert({ key: 'logo_url', value: 'REMOVED' }, { onConflict: 'key' });
      toggleTextBrandMode(true);
      toonPopup('Logo verwijderd!');
    }

    async function undoRemoveLogo() {
      await dbClient.from('settings').upsert({ key: 'logo_url', value: 'Logo.png' }, { onConflict: 'key' });
      toggleTextBrandMode(false);
      document.getElementById('current-logo-preview').src = 'Logo.png?' + new Date().getTime();
      toonPopup('Logo hersteld!');
    }

    async function saveBrandName() {
      const name = document.getElementById('setting-brand-name').value.trim();
      await dbClient.from('settings').upsert({ key: 'app_brand_name', value: name }, { onConflict: 'key' });
      toonPopup('Tekstnaam opgeslagen!');
    }

    async function clearXmlDatabase() {
      const pinCheck = prompt("Typ de DJ-pincode om te bevestigen:");
      if (pinCheck !== activeDjPin) return toonPopup("Onjuiste pincode.");
      await dbClient.from('requests').delete().neq('id', 0); 
      toonPopup("Database gewist!");
    }

    async function saveColors() {
      const colors = {
        bg: document.getElementById('col-bg').value,
        card: document.getElementById('col-card').value,
        accent: document.getElementById('col-accent').value,
        text: document.getElementById('col-text').value
      };
      await dbClient.from('settings').upsert({ key: 'app_colors', value: JSON.stringify(colors) }, { onConflict: 'key' });
      toonPopup('Kleuren opgeslagen!');
    }

    async function savePincode() {
      const pin = document.getElementById('setting-pincode').value.trim();
      if (pin.length !== 4) return toonPopup('Pincode moet 4 cijfers zijn!');
      await dbClient.from('settings').upsert({ key: 'app_pincode', value: pin }, { onConflict: 'key' });
      activeDjPin = pin;
      toonPopup('Pincode opgeslagen!');
    }

    function saveSupabaseCredentials() {
      const url = document.getElementById('setting-supabase-url').value.trim();
      const key = document.getElementById('setting-supabase-key').value.trim();
      const pass = document.getElementById('setting-admin-pass').value.trim();

      if (pass !== MASTER_KEY) return toonPopup("❌ Onjuist admin-wachtwoord!");
      localStorage.setItem('custom_supabase_url', url);
      localStorage.setItem('custom_supabase_key', key);
      toonPopup('Herladen...');
      setTimeout(() => location.reload(), 1200);
    }

    async function uploadLogo() {
      const fileInput = document.getElementById('logo-file-input'), file = fileInput.files[0];
      if (!file) return toonPopup('Kies eerst een bestand!');
      const fileName = `logo_${Date.now()}.${file.name.split('.').pop()}`;
      const { error } = await dbClient.storage.from('media').upload(fileName, file, { upsert: true });
      if (!error) {
        const { data: publicData } = dbClient.storage.from('media').getPublicUrl(fileName);
        await dbClient.from('settings').upsert({ key: 'logo_url', value: publicData.publicUrl }, { onConflict: 'key' });
        document.getElementById('current-logo-preview').src = publicData.publicUrl;
        toggleTextBrandMode(false);
        toonPopup('Logo opgeslagen!');
      }
    }
  </script>
</body>
</html>
